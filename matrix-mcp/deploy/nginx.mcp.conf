# This example assumes MCP_PATH=/mcp in the application config.
# If you change MCP_PATH, update this location block, proxy_pass target,
# public endpoint docs, and client example URLs together.
location /mcp {
    proxy_pass http://127.0.0.1:8767/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 10m;
}

location /health-mcp {
    proxy_pass http://127.0.0.1:8767/health;
}
