services:
  matrix-mcp:
    build: .
    container_name: matrix-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8767:8767"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8767/health"]
      interval: 30s
      timeout: 5s
      retries: 3
